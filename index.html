<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Jogo de Trivia - Teste seus conhecimentos!">
    
    <title>🎯 Jogo de Trivia</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://via.placeholder.com/192/667eea/white?text=T">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/667eea/white?text=T">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Estilos críticos inline para carregamento rápido */
        body { margin: 0; padding: 0; }
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1.5rem;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- Tela de Carregamento -->
    <div id="loading-screen">
        <div>🎯 Carregando jogo...</div>
    </div>

    <!-- Container do Jogo -->
    <div id="app"></div>

    <!-- Banner de Instalação PWA -->
    <div id="install-banner" style="display: none;">
        <div class="install-banner-content">
            <p>📲 Instale este jogo no seu celular!</p>
            <button onclick="installPWA()" class="install-btn">Instalar Agora</button>
            <button onclick="hideInstallBanner()" class="close-btn">✕</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="perguntas.js"></script>
    <script src="game.js"></script>
    
    <!-- Registrar Service Worker -->
    <script>
        // Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ PWA registrado!');
                    })
                    .catch(err => {
                        console.log('❌ Erro no PWA:', err);
                    });
            });
        }

        // Banner de instalação
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Mostrar banner após 30 segundos
            setTimeout(() => {
                if (deferredPrompt) {
                    document.getElementById('install-banner').style.display = 'flex';
                }
            }, 30000);
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ Usuário instalou o app');
                    }
                    deferredPrompt = null;
                    hideInstallBanner();
                });
            }
        }

        function hideInstallBanner() {
            document.getElementById('install-banner').style.display = 'none';
        }
    </script>
</body>
</html>
